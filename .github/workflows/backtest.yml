
name: Overnight LONG Backtest 030

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests matplotlib lxml html5lib

      - name: Run LONG backtest
        env:
          MPLBACKEND: Agg
        run: |
          python backtest_long_cost030.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-long-cost030-results
          path: |
            baseline_fig*.png
          if-no-files-found: warn
